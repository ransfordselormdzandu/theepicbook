services:
  database:
    image: mysql:8.0
    container_name: database
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/mysql
      - ./db/BuyTheBook_Schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/author_seed.sql:/docker-entrypoint-initdb.d/02-author-seed.sql
      - ./db/books_seed.sql:/docker-entrypoint-initdb.d/03-books-seed.sql
    networks:
      - back-tier

  backend:
    build: ./backend
    container_name: backend
    restart: always
    environment:
      NODE_ENV: production
      JAWSDB_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@database:3306/${MYSQL_DATABASE}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - front-tier
      - back-tier

  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    networks:
      - front-tier

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: reverse-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - front-tier

networks:
  front-tier:
  back-tier:
    internal: true

volumes:
  db_data:
